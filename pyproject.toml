[project]
name = "courtvision"
version = "0.1.0"
description = "NBA win probability engine — end-to-end ML system predicting game outcomes pre-game and live."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhinav Thati" }]

# Phase 1 runtime deps only. Later phases add their own (see optional-dependencies).
dependencies = [
    "nba_api>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Installed as phases come online: `pip install -e ".[dev]"`, `.[modeling]`, etc.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
modeling = [        # Phase 3
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "mlflow>=2.16",
]
api = [             # Phase 2
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errors, pyflakes, import-sort, pyupgrade, bugbear

[tool.pytest.ini_options]
testpaths = ["tests"]
